name: CMake Build

on:
  push:
    branches: [ main ]
    # A version tag builds a release (see the release job).
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The artifacts come from the oldest runners (glibc 2.35), so the binaries also run
          # on older targets; the GLib API is capped in CMakeLists.txt (BLE_SSH_GLIB_API).
          - os: ubuntu-22.04
            arch: x86_64
            artifact: true
          - os: ubuntu-22.04-arm
            arch: arm64
            artifact: true
          # The newest runners check that the code still builds cleanly with new compilers.
          - os: ubuntu-latest
            arch: x86_64
            artifact: false
          - os: ubuntu-24.04-arm
            arch: arm64
            artifact: false
    runs-on: ${{ matrix.os }}
    env:
      MAX_GLIBC: "2.35"

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS="-Werror"
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build Project
        run: cmake --build ${{github.workspace}}/build -- -j$(nproc)

      - name: Install Project
        # Staged with DESTDIR, so the artifact is a /usr tree that can be copied onto a target.
        # install.sh and the /etc/default example go next to it: `sudo ./install.sh` on the
        # device installs the tree, and scripts/install-target.sh runs it over ssh.
        run: |
          set -e
          install=${{github.workspace}}/install
          DESTDIR=$install cmake --install ${{github.workspace}}/build
          cp scripts/install.sh "$install/install.sh"
          cp systemd/ble-ssh.default "$install/ble-ssh.default"

      - name: Test Installation
        run: |
          set -e
          install=${{github.workspace}}/install
          ls -lR "$install"
          test -x "$install/usr/bin/ble_ssh_server"
          test -x "$install/usr/bin/ble_ssh_client"
          unit="$install/usr/lib/systemd/system/ble-ssh-server.service"
          test -f "$unit"
          test -f "$install/usr/lib/sysusers.d/ble-ssh.conf"
          grep -qx "ExecStart=/usr/bin/ble_ssh_server \$BLE_SSH_OPTS" "$unit"
          grep -qx "Type=notify" "$unit"
          "$install/usr/bin/ble_ssh_server" --help > /dev/null
          "$install/usr/bin/ble_ssh_client" --help > /dev/null
          sh -n "$install/install.sh"
          sh "$install/install.sh" --help > /dev/null
          echo "Installation test passed."

      - name: Check portability
        if: matrix.artifact
        run: |
          set -e
          for bin in ${{github.workspace}}/install/usr/bin/ble_ssh_*; do
            need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
            echo "$(basename "$bin"): needs glibc $need"
            if [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
              echo "::error::$(basename "$bin") needs glibc $need, newer than $MAX_GLIBC"
              exit 1
            fi
          done

      - name: Upload Build Artifacts
        if: matrix.artifact
        uses: actions/upload-artifact@v7
        with:
          name: ble-ssh-${{ matrix.arch }}
          path: ${{github.workspace}}/install
          retention-days: 5

  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Shellcheck
        run: |
          shellcheck --version | sed -n 2p
          shellcheck scripts/install.sh
          shellcheck -x scripts/install-target.sh

  # Artifacts can only be downloaded by logged-in users and expire, so the same /usr trees are
  # also published as release assets, which anyone can download:
  #   - a tag vX.Y.Z gets its own release,
  #   - every push to main updates the pre-release "main-latest".
  # Each has ble-ssh-<arch>.tar.gz (the tree with install.sh), install-target.sh made to
  # install that release without the repository, the Python client's wheel, and SHA256SUMS.
  release:
    needs: [ build, scripts ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release update at a time, so main-latest never mixes files from two pushes.
    concurrency:
      group: release-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          tag=${GITHUB_REF_NAME}
          py=v$(sed -n 's/^version = "\(.*\)"/\1/p' clients/python/pyproject.toml)
          init=v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' clients/python/src/ble_ssh_client/__init__.py)
          br=$(sed -n 's/^BLE_SSH_VERSION = //p' buildroot/package/ble-ssh/ble-ssh.mk)
          echo "tag $tag, pyproject.toml $py, __init__.py $init, ble-ssh.mk $br"
          if [ "$tag" != "$py" ] || [ "$tag" != "$init" ] || [ "$tag" != "$br" ]; then
            echo "::error::tag $tag does not match pyproject.toml ($py), __init__.py ($init) and ble-ssh.mk ($br)"
            exit 1
          fi

      - name: Build Python client
        # One pure-Python wheel for Windows, macOS and Linux: pipx install <its URL>.
        run: |
          set -e
          mkdir -p dist
          if [[ $GITHUB_REF != refs/tags/* ]]; then
            # A build of main is not the release of its version: add the commit (a PEP 440
            # local version), which --version and the GUI's title then show.
            v=$(sed -n 's/^version = "\(.*\)"/\1/p' clients/python/pyproject.toml)+g${GITHUB_SHA::7}
            sed -i "s/^version = \".*\"/version = \"$v\"/" clients/python/pyproject.toml
            sed -i "s/^__version__ = \".*\"/__version__ = \"$v\"/" clients/python/src/ble_ssh_client/__init__.py
          fi
          pipx run build --wheel --outdir dist clients/python
          ls dist

      - name: Package
        run: |
          set -e
          if [[ $GITHUB_REF == refs/tags/* ]]; then tag=$GITHUB_REF_NAME; else tag=main-latest; fi
          gh run download "$GITHUB_RUN_ID" --pattern 'ble-ssh-*' --dir artifacts
          mkdir -p dist
          for dir in artifacts/ble-ssh-*; do
            name=$(basename "$dir")
            # Artifacts do not keep file modes.
            chmod 0755 "$dir"/usr/bin/* "$dir/install.sh"
            # One top directory: `tar -xzf` gives ble-ssh-<arch>/install.sh and its usr/ tree.
            tar -czf "dist/$name.tar.gz" -C artifacts --owner=0 --group=0 --numeric-owner \
              "$name/usr" "$name/install.sh" "$name/ble-ssh.default"
          done
          # install-target.sh that works without the repository and installs this release.
          sed -e "s|^baked_repo=\$|baked_repo=$GITHUB_REPOSITORY|" -e "s|^baked_tag=\$|baked_tag=$tag|" \
            scripts/install-target.sh > dist/install-target.sh
          grep -qx "baked_repo=$GITHUB_REPOSITORY" dist/install-target.sh
          grep -qx "baked_tag=$tag" dist/install-target.sh
          (cd dist && sha256sum ./* | sed 's# \./# #' > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        # `gh release upload --clobber` deletes an asset before uploading its replacement, so a
        # failed upload (it happened once, from GitHub's side) left a release without its
        # binaries. Upload under temporary names first, retrying, and only then swap them in;
        # a failure leaves the previous files in place, and a re-run finishes the job.
        run: |
          set -e
          retry() {
            for attempt in 1 2 3 4; do
              "$@" && return 0
              [ "$attempt" = 4 ] && break
              echo "::warning::attempt $attempt failed: $*; retrying"
              sleep $((attempt * 10))
            done
            echo "::error::failed after 4 attempts: $*"
            return 1
          }
          # Replace the release's assets with dist/*, and drop those dist/ doesn't have.
          publish_assets() {
            local tag=$1 staged=staged name url
            rm -rf "$staged" && mkdir "$staged"
            for f in dist/*; do cp "$f" "$staged/$(basename "$f").new"; done
            retry gh release upload "$tag" "$staged"/* --clobber
            # The REST API's asset URLs: what renaming and deleting an asset take.
            retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | "\(.name) \(.url)"' > assets.txt
            for f in dist/*; do
              name=$(basename "$f")
              url=$(awk -v n="$name" '$1 == n {print $2}' assets.txt)
              [ -z "$url" ] || retry gh api -X DELETE "$url"
              url=$(awk -v n="$name.new" '$1 == n {print $2}' assets.txt)
              retry gh api -X PATCH "$url" -f name="$name" > /dev/null
            done
            # Drop what this build no longer has: the wheel's name changes with every commit.
            while read -r name url; do
              [ -e "dist/$name" ] || [ -e "dist/${name%.new}" ] || retry gh api -X DELETE "$url"
            done < assets.txt
          }
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=$GITHUB_REF_NAME
            if gh release view "$tag" > /dev/null 2>&1; then
              publish_assets "$tag"
            else
              retry gh release create "$tag" dist/* --verify-tag --title "ble-ssh $tag" --generate-notes
            fi
          else
            tag=main-latest
            notes="Newest build of main, from ${GITHUB_SHA::7}. Replaced on every push to main."
            if gh release view "$tag" > /dev/null 2>&1; then
              publish_assets "$tag"
              # Move the tag only once the files are there, so tag and files always match.
              retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
              retry gh release edit "$tag" --prerelease --notes "$notes"
            else
              retry gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" \
                --title "Latest build of main" --notes "$notes"
            fi
          fi

  python-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]  # oldest supported and newest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install client
        run: python -m pip install ./clients/python

      - name: Smoke test
        # No Bluetooth on the runners: check that it installs, imports and parses arguments.
        shell: bash
        run: |
          ble-ssh-client --version
          ble-ssh-client --help
          python -c "import ble_ssh_client.cli, ble_ssh_client.gui"
          ble-ssh-client --ssh-config AA:BB:CC:DD:EE:FF --user pi | grep -q "ProxyCommand .*ble-ssh-client.* AA:BB:CC:DD:EE:FF"

      - name: Unit tests
        # clients/python/tests mocks ssh, ffmpeg and the BLE client, so it needs none of them;
        # it runs against the package installed above.
        run: python -m unittest discover -s clients/python/tests -t clients/python/tests -v
